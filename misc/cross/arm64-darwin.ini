[constants]
macos_min = '13.1'
cflags = ['-mmacosx-version-min='+macos_min, '-mcpu=apple-m1']
ldflags = cflags + ldflags_macos

[binaries]
c = ['clang', '-target', 'arm64-apple-darwin']
objc = ['clang', '-target', 'arm64-apple-darwin']
cpp = ['clang++', '-target', 'arm64-apple-darwin']
objcpp = ['clang++', '-target', 'arm64-apple-darwin']
cmake = 'cmake'
rust = 'rustc'
strip = 'strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[build_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[built-in options]
c_args = cflags
c_link_args = ldflags
objc_args = cflags
objc_link_args = ldflags
cpp_args = cflags
cpp_link_args = ldflags
objcpp_args = cflags
objcpp_link_args = ldflags

[project options]
renderer_default = 'metal'
